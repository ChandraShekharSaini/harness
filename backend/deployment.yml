apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: project-1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
        - name: backend
          image: 499140333057.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:eb3f08d

          ports:
            - containerPort: 8084

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD


---


apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: project-1

spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084

  type: ClusterIP


     


