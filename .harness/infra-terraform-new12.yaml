
pipeline:
  name: infra Terraform

  inputs:
    aws_access_key_id:
      type: secret
      default: account.AWS_ACCESS_KEY_ID

    aws_secret_access_key:
      type: secret
      default: account.AWS_SECRET_ACCESS_KEY

  stages:
    - name: Terraform Infrastructure
      id: terraform_infrastructure

      runtime: cloud

      platform:
        os: linux
        arch: amd64

      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
        AWS_DEFAULT_REGION: us-east-1
        TF_WORKING_DIR: EKS-Terraform
        TF_IN_AUTOMATION: "true"

      steps:
        - name: Terraform Deployment
          run: |
            set -eu

            echo "=================================="
            echo "Harness Cloud Terraform Deployment"
            echo "=================================="

            echo "Installing dependencies..."

            sudo apt-get update
            sudo apt-get install -y curl unzip

            # Install Terraform
            TERRAFORM_VERSION=1.9.8

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

            unzip -o terraform.zip
            sudo install terraform /usr/local/bin/terraform

            # Install AWS CLI
            curl -fsSL \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o awscliv2.zip

            unzip -oq awscliv2.zip
            sudo ./aws/install --update

            echo "Checking dependencies..."

            terraform version
            aws --version
            git --version

            echo "=================================="
            echo "Validating AWS Credentials"
            echo "=================================="

            aws sts get-caller-identity

            echo "=================================="
            echo "Checking Terraform Directory"
            echo "=================================="

            pwd
            ls -la

            test -d "$TF_WORKING_DIR"
            cd "$TF_WORKING_DIR"

            echo "=================================="
            echo "Terraform Init"
            echo "=================================="

            terraform init -input=false

            echo "=================================="
            echo "Terraform Validate"
            echo "=================================="

            terraform validate

            echo "=================================="
            echo "Terraform Plan"
            echo "=================================="

            terraform plan \
              -input=false \
              -out=tfplan

            echo "=================================="
            echo "Terraform Apply"
            echo "=================================="

            terraform apply \
              -input=false \
              -auto-approve \
              tfplan

            echo "=================================="
            echo "Terraform Outputs"
            echo "=================================="

            terraform output

            echo "=================================="
            echo "Terraform Deployment Successful!"
            echo "=================================="
