
pipeline:
  name: infra Terraform

  repo:
    connector: account.YOUR_GITHUB_CONNECTOR_ID
    name: ChandraShekharSaini/harness

  clone:
    ref: main

  inputs:
    aws_access_key_id:
      type: secret
      default: account.AWS_ACCESS_KEY_ID

    aws_secret_access_key:
      type: secret
      default: account.AWS_SECRET_ACCESS_KEY

  stages:
    - name: Terraform Infrastructure
      id: terraform_infrastructure

      runtime: cloud

      platform:
        os: linux
        arch: amd64

      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
        AWS_DEFAULT_REGION: us-east-1
        TF_WORKING_DIR: EKS-Terraform
        TF_IN_AUTOMATION: "true"

      steps:
        - name: Terraform Deployment
          run: |
            set -eu

            echo "=================================="
            echo "HARNESS TERRAFORM DEPLOYMENT"
            echo "=================================="

            echo "========== WORKSPACE CHECK =========="
            pwd
            ls -la

            echo "========== INSTALL DEPENDENCIES =========="

            sudo apt-get update
            sudo apt-get install -y curl unzip git

            echo "========== INSTALL TERRAFORM =========="

            TERRAFORM_VERSION=1.9.8

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

            unzip -o terraform.zip
            sudo install terraform /usr/local/bin/terraform

            echo "========== INSTALL AWS CLI =========="

            curl -fsSL \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o awscliv2.zip

            unzip -oq awscliv2.zip
            sudo ./aws/install --update

            echo "========== CHECK VERSIONS =========="

            terraform version
            aws --version
            git --version

            echo "========== VALIDATE AWS CREDENTIALS =========="

            aws sts get-caller-identity

            echo "========== VERIFY GITHUB CHECKOUT =========="

            echo "Current workspace:"
            pwd
            ls -la

            echo "========== CHECK TERRAFORM DIRECTORY =========="

            if [ ! -d "$TF_WORKING_DIR" ]; then
              echo "ERROR: Terraform directory not found: $TF_WORKING_DIR"
              echo "Searching for Terraform files:"
              find . -maxdepth 5 -name "*.tf" -print
              exit 1
            fi

            cd "$TF_WORKING_DIR"

            echo "Terraform files:"
            ls -la

            if ! find . -maxdepth 1 -name "*.tf" -print -quit | grep -q .; then
              echo "ERROR: No Terraform files found."
              exit 1
            fi

            echo "========== TERRAFORM INIT =========="

            terraform init -input=false

            echo "========== TERRAFORM VALIDATE =========="

            terraform validate

            echo "========== TERRAFORM PLAN =========="

            terraform plan \
              -input=false \
              -out=tfplan

            echo "========== REVIEW PLAN BEFORE APPLY =========="
            echo "Review the Terraform plan for unintended resource deletion or replacement."

            echo "========== TERRAFORM APPLY =========="

            terraform apply \
              -input=false \
              -auto-approve \
              tfplan

            echo "========== TERRAFORM OUTPUTS =========="

            terraform output

            echo "=================================="
            echo "TERRAFORM DEPLOYMENT COMPLETED"
            echo "=================================="
