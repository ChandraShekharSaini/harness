
pipeline:
  name: infra Terraform

  inputs:
    aws_access_key_id:
      type: secret
      default: account.AWS_ACCESS_KEY_ID

    aws_secret_access_key:
      type: secret
      default: account.AWS_SECRET_ACCESS_KEY

  stages:
    - name: Terraform Infrastructure
      id: terraform_infrastructure

      runtime: cloud

      platform:
        os: linux
        arch: amd64

      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
        AWS_DEFAULT_REGION: us-east-1
        TF_WORKING_DIR: EKS-Terraform
        TF_IN_AUTOMATION: "true"

      steps:
        - name: Terraform Deployment
          run: |
            set -eu

            echo "=================================="
            echo "Harness Cloud Terraform Deployment"
            echo "=================================="

            echo "========== WORKSPACE CHECK =========="
            pwd
            ls -la

            echo "========== INSTALLING DEPENDENCIES =========="

            sudo apt-get update
            sudo apt-get install -y curl unzip git

            TERRAFORM_VERSION=1.9.8

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

            unzip -o terraform.zip
            sudo install terraform /usr/local/bin/terraform

            curl -fsSL \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o awscliv2.zip

            unzip -oq awscliv2.zip
            sudo ./aws/install --update

            echo "========== CHECKING TOOL VERSIONS =========="
            terraform version
            aws --version
            git --version

            echo "========== VALIDATING AWS CREDENTIALS =========="
            aws sts get-caller-identity

            echo "========== CHECKING TERRAFORM DIRECTORY =========="

            if [ ! -d "$TF_WORKING_DIR" ]; then
              echo "ERROR: $TF_WORKING_DIR not found."
              echo "Current workspace:"
              pwd
              ls -la
              echo "Searching workspace for Terraform files:"
              find . -maxdepth 5 -name "*.tf" -print
              exit 1
            fi

            cd "$TF_WORKING_DIR"

            echo "Terraform working directory:"
            pwd
            ls -la

            echo "========== TERRAFORM INIT =========="
            terraform init -input=false

            echo "========== TERRAFORM VALIDATE =========="
            terraform validate

            echo "========== TERRAFORM PLAN =========="
            terraform plan \
              -input=false \
              -out=tfplan

            echo "========== TERRAFORM APPLY =========="
            terraform apply \
              -input=false \
              -auto-approve \
              tfplan

            echo "========== TERRAFORM OUTPUTS =========="
            terraform output

            echo "Terraform deployment completed."
